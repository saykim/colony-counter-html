<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colony Counter Pro</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --primary: #0891b2;
            --primary-dark: #0e7490;
            --primary-light: #06b6d4;
            --secondary: #6366f1;
            --accent: #ec4899;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --bg-card: rgba(30, 41, 59, 0.8);
            
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-tertiary: #94a3b8;
            
            --glass-bg: rgba(248, 250, 252, 0.05);
            --glass-border: rgba(248, 250, 252, 0.1);
            
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.5);
            --shadow-xl: 0 20px 40px rgba(0, 0, 0, 0.6);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(8, 145, 178, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(99, 102, 241, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        
        .app-container {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            grid-template-rows: auto 1fr;
            gap: 0;
            height: 100vh;
        }
        
        /* Header */
        .app-header {
            grid-column: 1 / -1;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .app-title {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .app-logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: var(--shadow-md);
        }
        
        .app-title h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        
        .app-title .subtitle {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            font-weight: 400;
            margin-top: 0.125rem;
        }
        
        .header-actions {
            display: flex;
            gap: 0.75rem;
        }
        
        /* Left Sidebar - Tools */
        .sidebar-left {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            padding: 1.5rem;
            overflow-y: auto;
        }
        
        .tool-section {
            margin-bottom: 2rem;
        }
        
        .tool-section-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .tool-section-title::before {
            content: '';
            width: 3px;
            height: 12px;
            background: var(--primary);
            border-radius: 2px;
        }
        
        .tool-btn {
            width: 100%;
            padding: 0.875rem 1rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
        }
        
        .tool-btn:hover {
            background: var(--glass-border);
            border-color: var(--primary);
            transform: translateX(4px);
        }
        
        .tool-btn:active {
            transform: translateX(4px) scale(0.98);
        }
        
        .tool-btn.primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-color: transparent;
            box-shadow: var(--shadow-md);
        }
        
        .tool-btn.primary:hover {
            box-shadow: var(--shadow-lg);
            transform: translateX(4px) translateY(-2px);
        }
        
        .tool-btn.danger {
            background: var(--glass-bg);
            border-color: var(--danger);
            color: var(--danger);
        }
        
        .tool-btn.danger:hover {
            background: rgba(239, 68, 68, 0.1);
        }
        
        .tool-btn.active {
            background: rgba(239, 68, 68, 0.2);
            border-color: var(--danger);
            color: var(--danger);
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
        }
        
        .tool-btn i {
            font-size: 1.125rem;
            width: 20px;
            text-align: center;
        }
        
        /* Main Canvas Area */
        .canvas-area {
            background: var(--bg-primary);
            padding: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .canvas-wrapper {
            position: relative;
            max-width: 100%;
            max-height: 100%;
        }
        
        #mainCanvas {
            border-radius: 16px;
            box-shadow: var(--shadow-xl);
            cursor: crosshair;
            display: none;
            max-width: 100%;
            max-height: calc(100vh - 200px);
            border: 2px solid var(--glass-border);
        }
        
        #mainCanvas.delete-mode {
            cursor: not-allowed;
            border-color: var(--danger);
        }
        
        .upload-zone {
            width: 600px;
            height: 400px;
            border: 3px dashed var(--glass-border);
            border-radius: 24px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .upload-zone:hover {
            border-color: var(--primary);
            background: rgba(8, 145, 178, 0.05);
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }
        
        .upload-zone i {
            font-size: 5rem;
            color: var(--primary);
            opacity: 0.6;
        }
        
        .upload-zone h2 {
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .upload-zone p {
            color: var(--text-tertiary);
            font-size: 0.875rem;
        }
        
        .completion-badge {
            position: absolute;
            top: 2rem;
            left: 2rem;
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
            color: white;
            padding: 1rem 2rem;
            border-radius: 16px;
            font-size: 1.75rem;
            font-weight: 700;
            box-shadow: var(--shadow-xl);
            display: none;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
        @keyframes bounceIn {
            0% { transform: scale(0) rotate(-12deg); opacity: 0; }
            50% { transform: scale(1.1) rotate(2deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        
        /* Right Sidebar - Stats & Controls */
        .sidebar-right {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-left: 1px solid var(--glass-border);
            padding: 1.5rem;
            overflow-y: auto;
        }
        
        .stat-card {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: shimmer 3s infinite;
        }
        
        @keyframes shimmer {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(180deg); }
        }
        
        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            opacity: 0.9;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        
        .stat-value {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
        }
        
        .control-group {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .control-group-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .control-item {
            margin-bottom: 1.5rem;
        }
        
        .control-item:last-child {
            margin-bottom: 0;
        }
        
        .control-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            font-size: 0.8125rem;
            color: var(--text-tertiary);
        }
        
        .control-value {
            color: var(--primary);
            font-weight: 600;
            font-size: 0.875rem;
        }
        
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: var(--bg-tertiary);
            outline: none;
            transition: all 0.2s ease;
        }
        
        input[type="range"]:hover {
            background: var(--bg-secondary);
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            cursor: pointer;
            box-shadow: var(--shadow-md);
            transition: all 0.2s ease;
        }
        
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 0 6px rgba(8, 145, 178, 0.2);
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            cursor: pointer;
            border: none;
            box-shadow: var(--shadow-md);
            transition: all 0.2s ease;
        }
        
        input[type="range"]::-moz-range-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 0 6px rgba(8, 145, 178, 0.2);
        }
        
        .legend {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
        }
        
        .legend-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.875rem;
            font-size: 0.8125rem;
            color: var(--text-tertiary);
        }
        
        .legend-item:last-child {
            margin-bottom: 0;
        }
        
        .legend-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--primary);
        }
        
        .legend-marker {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.3);
            border: 2px solid var(--danger);
            flex-shrink: 0;
        }
        
        .kbd {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        
        /* Notifications */
        .notification-container {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 400px;
        }
        
        .notification {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 1rem;
            animation: slideIn 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            overflow: hidden;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .notification::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 100%;
        }
        
        .notification.success::before { background: var(--success); }
        .notification.info::before { background: var(--primary); }
        .notification.warning::before { background: var(--warning); }
        .notification.danger::before { background: var(--danger); }
        
        .notification-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            flex-shrink: 0;
        }
        
        .notification.success .notification-icon {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }
        
        .notification.info .notification-icon {
            background: rgba(8, 145, 178, 0.2);
            color: var(--primary);
        }
        
        .notification.warning .notification-icon {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }
        
        .notification.danger .notification-icon {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }
        
        .notification-content {
            flex: 1;
            font-size: 0.875rem;
            color: var(--text-primary);
        }
        
        .notification-close {
            background: none;
            border: none;
            color: var(--text-tertiary);
            cursor: pointer;
            padding: 0.25rem;
            font-size: 1.125rem;
            transition: color 0.2s ease;
        }
        
        .notification-close:hover {
            color: var(--text-primary);
        }
        
        /* Click Effect */
        .click-effect {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 3px solid var(--primary);
            border-radius: 50%;
            pointer-events: none;
            animation: ripple 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @keyframes ripple {
            from {
                transform: scale(0.5);
                opacity: 1;
            }
            to {
                transform: scale(2.5);
                opacity: 0;
            }
        }
        
        /* Responsive */
        @media (max-width: 1400px) {
            .app-container {
                grid-template-columns: 260px 1fr 300px;
            }
        }
        
        @media (max-width: 1200px) {
            .app-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr;
            }
            
            .sidebar-left,
            .sidebar-right {
                border: none;
                border-bottom: 1px solid var(--glass-border);
            }
            
            .tool-section {
                display: inline-block;
                margin-right: 1rem;
                vertical-align: top;
            }
            
            .tool-btn {
                display: inline-flex;
                width: auto;
            }
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--bg-tertiary);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Notification Container -->
    <div class="notification-container" id="notificationContainer"></div>
    
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="app-title">
                <div class="app-logo">
                    <i class="fas fa-microscope"></i>
                </div>
                <div>
                    <h1>Colony Counter Pro</h1><h3> by BDK</h3>
                    <div class="subtitle">Professional Microbiology Analysis Tool</div>
                </div>
            </div>
        </header>
        
        <!-- Left Sidebar -->
        <aside class="sidebar-left">
            <div class="tool-section">
                <div class="tool-section-title">
                    <span>파일 작업</span>
                </div>
                <button class="tool-btn primary" onclick="uploadImage()">
                    <i class="fas fa-upload"></i>
                    <span>이미지 업로드</span>
                </button>
                <button class="tool-btn" onclick="saveData()">
                    <i class="fas fa-save"></i>
                    <span>데이터 저장</span>
                </button>
                <button class="tool-btn" onclick="loadData()">
                    <i class="fas fa-folder-open"></i>
                    <span>데이터 불러오기</span>
                </button>
                <button class="tool-btn" onclick="saveImage()">
                    <i class="fas fa-image"></i>
                    <span>이미지 내보내기</span>
                </button>
            </div>
            
            <div class="tool-section">
                <div class="tool-section-title">
                    <span>편집 도구</span>
                </div>
                <button class="tool-btn" onclick="toggleDeleteMode()" id="deleteBtn">
                    <i class="fas fa-eraser"></i>
                    <span>삭제 모드</span>
                </button>
                <button class="tool-btn" onclick="undoLastMarker()">
                    <i class="fas fa-undo"></i>
                    <span>실행 취소</span>
                </button>
                <button class="tool-btn danger" onclick="clearAll()">
                    <i class="fas fa-trash-alt"></i>
                    <span>전체 초기화</span>
                </button>
            </div>
            
            <div class="tool-section">
                <div class="tool-section-title">
                    <span>분석</span>
                </div>
                <button class="tool-btn primary" onclick="completeCount()">
                    <i class="fas fa-check-circle"></i>
                    <span>카운팅 완료</span>
                </button>
            </div>
        </aside>
        
        <!-- Main Canvas -->
        <main class="canvas-area">
            <div class="canvas-wrapper">
                <div class="upload-zone" id="uploadZone" onclick="uploadImage()">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <h2>이미지 업로드</h2>
                    <p>JPG, PNG, GIF, WebP 지원 (최대 50MB)</p>
                </div>
                <canvas id="mainCanvas"></canvas>
                <div class="completion-badge" id="completionBadge"></div>
            </div>
        </main>
        
        <!-- Right Sidebar -->
        <aside class="sidebar-right">
            <!-- Counter Stats -->
            <div class="stat-card">
                <div class="stat-label">Total Colonies</div>
                <div class="stat-value" id="counterDisplay">0</div>
            </div>
            
            <!-- View Controls -->
            <div class="control-group">
                <div class="control-group-title">
                    <i class="fas fa-sliders-h"></i>
                    <span>뷰 설정</span>
                </div>
                <div class="control-item">
                    <div class="control-label">
                        <span>이미지 크기</span>
                        <span class="control-value" id="imageSizeValue">100%</span>
                    </div>
                    <input type="range" id="imageSizeSlider" min="10" max="100" value="100" step="5">
                </div>
                <div class="control-item">
                    <div class="control-label">
                        <span>마커 크기</span>
                        <span class="control-value" id="markerSizeValue">12px</span>
                    </div>
                    <input type="range" id="markerSizeSlider" min="5" max="30" value="12" step="1">
                </div>
            </div>
            
            <!-- Legend -->
            <div class="legend">
                <div class="legend-title">
                    <i class="fas fa-keyboard"></i>
                    <span>단축키</span>
                </div>
                <div class="legend-item">
                    <div class="legend-marker"></div>
                    <span>클릭으로 집락 마킹</span>
                </div>
                <div class="legend-item">
                    <div class="legend-icon">
                        <i class="fas fa-mouse-pointer"></i>
                    </div>
                    <span><span class="kbd">D</span> 삭제 모드 토글</span>
                </div>
                <div class="legend-item">
                    <div class="legend-icon">
                        <i class="fas fa-undo"></i>
                    </div>
                    <span><span class="kbd">Ctrl</span> + <span class="kbd">Z</span> 실행 취소</span>
                </div>
                <div class="legend-item">
                    <div class="legend-icon">
                        <i class="fas fa-save"></i>
                    </div>
                    <span><span class="kbd">Ctrl</span> + <span class="kbd">S</span> 저장</span>
                </div>
                <div class="legend-item">
                    <div class="legend-icon">
                        <i class="fas fa-times"></i>
                    </div>
                    <span><span class="kbd">ESC</span> 삭제 모드 해제</span>
                </div>
            </div>
        </aside>
    </div>
    
    <!-- Hidden Inputs -->
    <input type="file" id="imageInput" accept="image/jpeg,image/png,image/gif,image/webp" style="display: none;">
    <input type="file" id="dataInput" accept=".json" style="display: none;">
    
    <script>
        // State Management
        const state = {
            image: null,
            originalWidth: 0,
            originalHeight: 0,
            displayScale: 1.0,
            markers: [],
            markerSize: 12,
            deleteMode: false,
            isCompleted: false
        };
        
        // DOM Elements
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const uploadZone = document.getElementById('uploadZone');
        const counterDisplay = document.getElementById('counterDisplay');
        const imageSizeSlider = document.getElementById('imageSizeSlider');
        const imageSizeValue = document.getElementById('imageSizeValue');
        const markerSizeSlider = document.getElementById('markerSizeSlider');
        const markerSizeValue = document.getElementById('markerSizeValue');
        const deleteBtn = document.getElementById('deleteBtn');
        const completionBadge = document.getElementById('completionBadge');
        const imageInput = document.getElementById('imageInput');
        const dataInput = document.getElementById('dataInput');
        
        // Initialize
        function init() {
            setupEventListeners();
            updateCounter();
        }
        
        function setupEventListeners() {
            canvas.addEventListener('click', handleCanvasClick);
            
            imageSizeSlider.addEventListener('input', (e) => {
                state.displayScale = e.target.value / 100;
                imageSizeValue.textContent = e.target.value + '%';
                render();
            });
            
            markerSizeSlider.addEventListener('input', (e) => {
                state.markerSize = parseInt(e.target.value);
                markerSizeValue.textContent = e.target.value + 'px';
                render();
            });
            
            imageInput.addEventListener('change', handleImageUpload);
            dataInput.addEventListener('change', handleDataLoad);
            document.addEventListener('keydown', handleKeyPress);
        }
        
        function handleKeyPress(e) {
            if (e.ctrlKey && e.key === 'z') {
                e.preventDefault();
                undoLastMarker();
            }
            if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                saveData();
            }
            if (e.key === 'd' || e.key === 'D') {
                if (!e.ctrlKey && !e.altKey && !e.metaKey) {
                    toggleDeleteMode();
                }
            }
            if (e.key === 'Escape' && state.deleteMode) {
                toggleDeleteMode();
            }
        }
        
        function uploadImage() {
            imageInput.click();
        }
        
        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            if (file.size > 50 * 1024 * 1024) {
                showNotification('파일 크기가 50MB를 초과합니다', 'danger');
                return;
            }
            
            if (!file.type.match(/image\/(jpeg|png|gif|webp)/)) {
                showNotification('지원하지 않는 파일 형식입니다', 'danger');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    state.image = img;
                    state.originalWidth = img.width;
                    state.originalHeight = img.height;
                    state.markers = [];
                    state.isCompleted = false;
                    completionBadge.style.display = 'none';
                    
                    uploadZone.style.display = 'none';
                    canvas.style.display = 'block';
                    
                    render();
                    updateCounter();
                    showNotification('이미지가 성공적으로 로드되었습니다', 'success');
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
        
        function render() {
            if (!state.image) return;
            
            const displayWidth = state.originalWidth * state.displayScale;
            const displayHeight = state.originalHeight * state.displayScale;
            
            canvas.width = displayWidth;
            canvas.height = displayHeight;
            
            ctx.drawImage(state.image, 0, 0, displayWidth, displayHeight);
            
            state.markers.forEach((marker, index) => {
                drawMarker(
                    marker.x * state.displayScale,
                    marker.y * state.displayScale,
                    index + 1
                );
            });
        }
        
        function drawMarker(x, y, number) {
            const radius = state.markerSize;
            
            // Outer glow
            ctx.beginPath();
            ctx.arc(x, y, radius + 4, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(239, 68, 68, 0.2)';
            ctx.fill();
            
            // Main circle
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(239, 68, 68, 0.4)';
            ctx.fill();
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 2.5;
            ctx.stroke();
            
            // Number
            ctx.font = `bold ${Math.max(11, radius * 0.9)}px Inter`;
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            ctx.shadowBlur = 4;
            ctx.fillText(number, x, y);
            ctx.shadowBlur = 0;
        }
        
        function handleCanvasClick(e) {
            if (!state.image) return;
            
            const rect = canvas.getBoundingClientRect();
            // 1. 클릭 위치 (화면 표시 기준)
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;
            
            // 2. Canvas 실제 크기와 표시 크기의 비율 계산 (핵심!)
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            // 3. Canvas 픽셀 좌표로 변환
            const canvasX = clickX * scaleX;
            const canvasY = clickY * scaleY;
            
            // 4. 원본 이미지 좌표로 변환
            const originalX = canvasX / state.displayScale;
            const originalY = canvasY / state.displayScale;
            
            if (state.deleteMode) {
                deleteMarkerAt(canvasX, canvasY);
            } else {
                state.markers.push({ x: originalX, y: originalY });
                render();
                updateCounter();
                showClickEffect(e.clientX, e.clientY);
            }
        }
        
        function deleteMarkerAt(canvasX, canvasY) {
            const threshold = state.markerSize + 5;
            let minDist = Infinity;
            let minIndex = -1;
            
            // 각 마커를 canvas 픽셀 좌표로 변환하여 거리 계산
            state.markers.forEach((marker, index) => {
                const markerCanvasX = marker.x * state.displayScale;
                const markerCanvasY = marker.y * state.displayScale;
                
                const dx = markerCanvasX - canvasX;
                const dy = markerCanvasY - canvasY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < threshold && dist < minDist) {
                    minDist = dist;
                    minIndex = index;
                }
            });
            
            if (minIndex !== -1) {
                state.markers.splice(minIndex, 1);
                state.isCompleted = false;
                completionBadge.style.display = 'none';
                render();
                updateCounter();
                showNotification('마커가 삭제되었습니다', 'warning');
            }
        }
        
        function toggleDeleteMode() {
            state.deleteMode = !state.deleteMode;
            
            if (state.deleteMode) {
                canvas.classList.add('delete-mode');
                deleteBtn.classList.add('active');
                showNotification('삭제 모드 활성화', 'warning');
            } else {
                canvas.classList.remove('delete-mode');
                deleteBtn.classList.remove('active');
                showNotification('삭제 모드 해제', 'info');
            }
        }
        
        function undoLastMarker() {
            if (state.markers.length === 0) {
                showNotification('취소할 마커가 없습니다', 'info');
                return;
            }

            state.markers.pop();
            state.isCompleted = false;
            completionBadge.style.display = 'none';
            render();
            updateCounter();
            showNotification('마지막 마커가 취소되었습니다', 'info');
        }
        
        function clearAll() {
            if (state.markers.length === 0) {
                showNotification('삭제할 마커가 없습니다', 'info');
                return;
            }
            
            if (confirm('모든 마커를 삭제하시겠습니까?')) {
                state.markers = [];
                state.isCompleted = false;
                completionBadge.style.display = 'none';
                render();
                updateCounter();
                showNotification('모든 마커가 삭제되었습니다', 'warning');
            }
        }
        
        function completeCount() {
            if (!state.image) {
                showNotification('이미지를 먼저 업로드해주세요', 'warning');
                return;
            }
            
            if (state.markers.length === 0) {
                showNotification('마킹된 집락이 없습니다', 'warning');
                return;
            }
            
            state.isCompleted = true;
            completionBadge.textContent = `Total: ${state.markers.length}`;
            completionBadge.style.display = 'block';
            showNotification(`카운팅 완료! 총 ${state.markers.length}개`, 'success');
        }
        
        function updateCounter() {
            counterDisplay.textContent = state.markers.length;
        }
        
        function saveData() {
            if (!state.image) {
                showNotification('저장할 데이터가 없습니다', 'warning');
                return;
            }
            
            const data = {
                timestamp: new Date().toISOString(),
                totalCount: state.markers.length,
                originalWidth: state.originalWidth,
                originalHeight: state.originalHeight,
                markers: state.markers,
                imageData: canvas.toDataURL('image/png')
            };
            
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `colony-count-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            
            showNotification('데이터가 저장되었습니다', 'success');
        }
        
        function loadData() {
            dataInput.click();
        }
        
        function handleDataLoad(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const data = JSON.parse(event.target.result);
                    
                    const img = new Image();
                    img.onload = () => {
                        state.image = img;
                        state.originalWidth = data.originalWidth;
                        state.originalHeight = data.originalHeight;
                        
                        if (img.width !== data.originalWidth || img.height !== data.originalHeight) {
                            const scaleX = img.width / data.originalWidth;
                            const scaleY = img.height / data.originalHeight;
                            state.markers = data.markers.map(m => ({
                                x: m.x * scaleX,
                                y: m.y * scaleY
                            }));
                            showNotification('이미지 크기가 다릅니다. 좌표가 자동 조정되었습니다', 'info');
                        } else {
                            state.markers = data.markers;
                        }
                        
                        state.isCompleted = false;
                        completionBadge.style.display = 'none';
                        
                        uploadZone.style.display = 'none';
                        canvas.style.display = 'block';
                        
                        render();
                        updateCounter();
                        showNotification('데이터가 성공적으로 로드되었습니다', 'success');
                    };
                    img.src = data.imageData;
                    
                } catch (error) {
                    showNotification('데이터 로드 실패: 잘못된 파일 형식', 'danger');
                }
            };
            reader.readAsText(file);
        }
        
        function saveImage() {
            if (!state.image) {
                showNotification('저장할 이미지가 없습니다', 'warning');
                return;
            }

            // 완료 상태일 때 canvas에 카운팅 숫자 그리기
            if (state.isCompleted) {
                const displayWidth = state.originalWidth * state.displayScale;
                const displayHeight = state.originalHeight * state.displayScale;

                // 배지 배경
                const padding = 20;
                const badgeX = 30;
                const badgeY = 30;
                const badgeText = `Total: ${state.markers.length}`;

                ctx.font = 'bold 28px Inter';
                const textMetrics = ctx.measureText(badgeText);
                const badgeWidth = textMetrics.width + padding * 2;
                const badgeHeight = 50;

                // 배지 그림자
                ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
                ctx.shadowBlur = 24;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 8;

                // 배지 배경 그라디언트
                const gradient = ctx.createLinearGradient(badgeX, badgeY, badgeX + badgeWidth, badgeY + badgeHeight);
                gradient.addColorStop(0, '#10b981');
                gradient.addColorStop(1, '#059669');

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.roundRect(badgeX, badgeY, badgeWidth, badgeHeight, 16);
                ctx.fill();

                // 배지 테두리
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.shadowBlur = 0;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;

                // 텍스트
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
                ctx.shadowBlur = 4;
                ctx.fillText(badgeText, badgeX + padding, badgeY + badgeHeight / 2);
                ctx.shadowBlur = 0;
            }

            const url = canvas.toDataURL('image/png');
            const a = document.createElement('a');
            a.href = url;
            a.download = `colony-count-result-${Date.now()}.png`;
            a.click();

            // canvas 다시 그리기 (배지 제거)
            render();

            showNotification('이미지가 저장되었습니다', 'success');
        }
        
        function showClickEffect(x, y) {
            const effect = document.createElement('div');
            effect.className = 'click-effect';
            effect.style.left = (x - 20) + 'px';
            effect.style.top = (y - 20) + 'px';
            document.body.appendChild(effect);
            
            setTimeout(() => effect.remove(), 600);
        }
        
        function showNotification(message, type = 'info') {
            const container = document.getElementById('notificationContainer');
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            
            const icons = {
                success: 'fa-check-circle',
                info: 'fa-info-circle',
                warning: 'fa-exclamation-triangle',
                danger: 'fa-times-circle'
            };
            
            notification.innerHTML = `
                <div class="notification-icon">
                    <i class="fas ${icons[type]}"></i>
                </div>
                <div class="notification-content">${message}</div>
                <button class="notification-close" onclick="this.parentElement.remove()">
                    <i class="fas fa-times"></i>
                </button>
            `;
            
            container.appendChild(notification);
            setTimeout(() => notification.remove(), 5000);
        }
        
        window.addEventListener('load', init);
    </script>
</body>
</html>
